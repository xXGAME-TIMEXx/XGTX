name: Deploy daemon public metrics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: xgtx-production-daemon
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY_HOST: 5.78.219.248
      CANDIDATE_RUN_ID: "45331229498"
      CANDIDATE_SHA256: 3264dbf5e71141dbdaa8fa7c42ee1c5df45117458b96529d7c8869fd0988812b
    steps:
      - uses: actions/checkout@v4

      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: xgtxd-public-metrics-ubuntu24-x86_64
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Verify candidate checksum
        run: |
          set -euo pipefail
          echo "$CANDIDATE_SHA256  candidate/xgtxd-public-metrics" | sha256sum --check
          chmod 0755 candidate/xgtxd-public-metrics

      - name: Configure temporary SSH access
        env:
          XGTX_DEPLOY_KEY: ${{ secrets.XGTX_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$XGTX_DEPLOY_KEY"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$XGTX_DEPLOY_KEY" > ~/.ssh/xgtx-github-deploy
          chmod 0600 ~/.ssh/xgtx-github-deploy
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Preflight production host
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/xgtx-github-deploy root@"$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          systemctl is-active --quiet xgtxd.service
          systemctl is-active --quiet xgtx-indexer.service
          command -v sha256sum >/dev/null
          command -v systemctl >/dev/null
          command -v ss >/dev/null
          unit_value="$(systemctl show -p ExecStart --value xgtxd.service)"
          binary="$(printf '%s\n' "$unit_value" | sed -n 's/.*path=\([^ ;}]*\).*/\1/p')"
          test -n "$binary"
          test -x "$binary"
          case "$binary" in /*) ;; *) exit 1 ;; esac
          printf 'daemon_binary=%s\n' "$binary"
          "$binary" --version
          REMOTE

      - name: Upload candidate
        run: |
          set -euo pipefail
          scp -i ~/.ssh/xgtx-github-deploy candidate/xgtxd-public-metrics root@"$DEPLOY_HOST":/tmp/xgtxd-public-metrics.new

      - name: Install with automatic rollback
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/xgtx-github-deploy root@"$DEPLOY_HOST" \
            'bash -se' < infrastructure/daemon-public-metrics/finish-production-deploy.sh

      - name: Revoke temporary deployment key
        if: always()
        run: |
          if test -s ~/.ssh/xgtx-github-deploy; then
            ssh -i ~/.ssh/xgtx-github-deploy root@"$DEPLOY_HOST" \
              "sed -i '/xgtx-github-actions/d' /root/.ssh/authorized_keys" || true
          fi
          rm -f ~/.ssh/xgtx-github-deploy
